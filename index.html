<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ananda Guru - Kundali Chart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #chartContainer {
            width: 600px;
            height: 600px;
            background: #111827;
            border: 4px solid #f59e0b;
            position: relative;
            box-sizing: border-box;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="chartContainer">
        <canvas id="kundaliCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : 'DEVOTEE';
        const userDob = urlParams.get('dob') ? decodeURIComponent(urlParams.get('dob')) : '12-03-2003';
        const userTime = urlParams.get('time') ? decodeURIComponent(urlParams.get('time')) : '10:30 AM';

        const canvas = document.getElementById('kundaliCanvas');
        const ctx = canvas.getContext('2d');

        // Background & North Indian Chart Borders
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, 600, 600);

        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, 580, 580);

        // Diagonal lines for 12 houses
        ctx.beginPath();
        ctx.moveTo(10, 10); ctx.lineTo(590, 590);
        ctx.moveTo(590, 10); ctx.lineTo(10, 590);
        
        ctx.moveTo(300, 10); ctx.lineTo(590, 300);
        ctx.moveTo(590, 300); ctx.lineTo(300, 590);
        ctx.moveTo(300, 590); ctx.lineTo(10, 300);
        ctx.moveTo(10, 300); ctx.lineTo(300, 10);
        
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.stroke();

        // House Numbers (1 to 12) inside the chart boxes
        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        ctx.fillText("1", 300, 100);
        ctx.fillText("2", 100, 60);
        ctx.fillText("3", 60, 100);
        ctx.fillText("4", 180, 300);
        ctx.fillText("5", 60, 500);
        ctx.fillText("6", 100, 540);
        ctx.fillText("7", 300, 500);
        ctx.fillText("8", 500, 540);
        ctx.fillText("9", 540, 500);
        ctx.fillText("10", 420, 300);
        ctx.fillText("11", 540, 100);
        ctx.fillText("12", 500, 60);

        // Planet Symbols in Houses (Sample traditional placements)
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("As", 300, 140);
        ctx.fillText("Ke", 480, 80);
        ctx.fillText("Sy", 120, 300);
        ctx.fillText("Gu, Ch", 420, 340);
        ctx.fillText("Sk", 500, 480);
        ctx.fillText("Ra", 120, 500);
        ctx.fillText("Sa", 300, 460);

        // Center Box for User Details (Name, DOB, Time)
        ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
        ctx.fillRect(160, 230, 280, 140);
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2;
        ctx.strokeRect(160, 230, 280, 140);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Arial";
        ctx.fillText(userName, 300, 265);

        ctx.fillStyle = "#38bdf8";
        ctx.font = "13px Arial";
        ctx.fillText("DOB: " + userDob, 300, 300);
        ctx.fillText("Time: " + userTime, 300, 330);
    </script>
</body>
</html>
