<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ananda Guru - Original Planets Kundali</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }
        #chartContainer { width: 600px; height: 600px; position: relative; box-sizing: border-box; background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600&auto=format&fit=crop'); background-size: cover; background-position: center; border: 4px solid #f59e0b; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="chartContainer">
        <canvas id="kundaliCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : 'BURIDI VIKASH RAJU';
        const userDob = urlParams.get('dob') ? decodeURIComponent(urlParams.get('dob')) : '12-03-2003';
        const userTime = urlParams.get('time') ? decodeURIComponent(urlParams.get('time')) : '10:30 AM';

        const canvas = document.getElementById('kundaliCanvas');
        const ctx = canvas.getContext('2d');

        // North Indian Chart Diagonal Lines
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, 600, 600);

        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(600, 600);
        ctx.moveTo(600, 0); ctx.lineTo(0, 600);
        ctx.moveTo(300, 0); ctx.lineTo(600, 300);
        ctx.moveTo(600, 300); ctx.lineTo(300, 600);
        ctx.moveTo(300, 600); ctx.lineTo(0, 300);
        ctx.moveTo(0, 300); ctx.lineTo(300, 0);
        ctx.stroke();

        // Center User Name and Details Box
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(120, 230, 360, 120);
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2;
        ctx.strokeRect(120, 230, 360, 120);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText(userName, 300, 270);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 14px Arial";
        ctx.fillText("DOB: " + userDob + "   TIME: " + userTime, 300, 315);

        // మీ ఒరిజినల్ గ్రహాల ఇమేజ్ లింక్స్ (Navagraha Images)
        const planets = [
            { url: 'https://i.ibb.co/cKFT5BQ8/surya-png.png', x: 300, y: 90 }, // సూర్యుడు
            { url: 'https://i.ibb.co/svSx8jxW/chandra-png.png', x: 150, y: 75 }, // చంద్రుడు
            { url: 'https://i.ibb.co/S4kmV6sc/mangala.png', x: 450, y: 75 }, // కుజుడు (మంగళ)
            { url: 'https://i.ibb.co/84dXYS0Q/budha-png.png', x: 530, y: 180 }, // బుధుడు
            { url: 'https://i.ibb.co/TqPBxK7Z/guru-png.png', x: 75, y: 230 }, // గురు
            { url: 'https://i.ibb.co/NgxgvdXf/shukra-png.png', x: 530, y: 420 }, // శుక్ర
            { url: 'https://i.ibb.co/v4vSwZJS/shani.png', x: 75, y: 480 }, // శని
            { url: 'https://i.ibb.co/23XjGRqH/rahu-png.png', x: 300, y: 525 }, // రాహు
            { url: 'https://i.ibb.co/GvzdFxD3/ketu-png.png', x: 450, y: 525 } // కేతు
        ];

        // Drawing original planet images on the canvas
        planets.forEach(p => {
            let img = new Image();
            img.crossOrigin = "Anonymous"; 
            img.src = p.url;
            img.onload = function() {
                ctx.drawImage(img, p.x - 22, p.y - 22, 45, 45); // 45x45 Size of planets
            }
        });
    </script>
</body>
</html>
