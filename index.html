<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ananda Guru - Vedic Kundali Chart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #chartContainer {
            width: 600px;
            height: 600px;
            background: #111827;
            border: 4px solid #f59e0b;
            position: relative;
            box-sizing: border-box;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="chartContainer">
        <canvas id="kundaliCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('kundaliCanvas');
        const ctx = canvas.getContext('2d');

        // Background & Outer Border
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, 600, 600);

        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, 580, 580);

        // North Indian Chart Diagonal Lines
        ctx.beginPath();
        ctx.moveTo(10, 10); ctx.lineTo(590, 590);
        ctx.moveTo(590, 10); ctx.lineTo(10, 590);
        
        ctx.moveTo(300, 10); ctx.lineTo(590, 300);
        ctx.moveTo(590, 300); ctx.lineTo(300, 590);
        ctx.moveTo(300, 590); ctx.lineTo(10, 300);
        ctx.moveTo(10, 300); ctx.lineTo(300, 10);
        
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.stroke();

        // House Numbers (1 to 12)
        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        ctx.fillText("1", 300, 85);
        ctx.fillText("2", 100, 50);
        ctx.fillText("3", 50, 100);
        ctx.fillText("4", 170, 300);
        ctx.fillText("5", 50, 500);
        ctx.fillText("6", 100, 550);
        ctx.fillText("7", 300, 515);
        ctx.fillText("8", 500, 550);
        ctx.fillText("9", 550, 500);
        ctx.fillText("10", 430, 300);
        ctx.fillText("11", 550, 100);
        ctx.fillText("12", 500, 50);

        // Planet Icons / Abbreviations (గ్రహాల గుర్తులు)
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        
        ctx.fillText("As", 300, 125);     // 1వ ఇల్లు (లగ్నం)
        ctx.fillText("Ke", 480, 70);     // 12వ ఇల్లు
        ctx.fillText("Sy", 110, 300);    // 4వ ఇల్లు (సూర్యుడు)
        ctx.fillText("Ju, Me", 430, 340); // 10వ ఇల్లు (గురు, బుధ)
        ctx.fillText("Ve", 510, 480);    // 8వ ఇల్లు (శుక్రుడు)
        ctx.fillText("Ra", 110, 480);    // 6వ ఇల్లు (రాహువు)
        ctx.fillText("Sa", 300, 465);    // 7వ ఇల్లు (శని)
    </script>
</body>
</html>
