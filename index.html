<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ananda Guru - Original Planets Kundali</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }
        #chartContainer { width: 600px; height: 600px; position: relative; box-sizing: border-box; background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600&auto=format&fit=crop'); background-size: cover; background-position: center; border: 4px solid #f59e0b; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="chartContainer">
        <canvas id="kundaliCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('kundaliCanvas');
        const ctx = canvas.getContext('2d');

        // North Indian Chart Diagonal Lines
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, 600, 600);

        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(600, 600);
        ctx.moveTo(600, 0); ctx.lineTo(0, 600);
        ctx.moveTo(300, 0); ctx.lineTo(600, 300);
        ctx.moveTo(600, 300); ctx.lineTo(300, 600);
        ctx.moveTo(300, 600); ctx.lineTo(0, 300);
        ctx.moveTo(0, 300); ctx.lineTo(300, 0);
        ctx.stroke();

        // 1 to 12 House Numbers (Gold Color) - Added elegantly at corners
        ctx.fillStyle = "#fbbf24"; // Gold color
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText("1", 300, 60);   // Top Diamond
        ctx.fillText("2", 120, 40);   // Top Left Triangle
        ctx.fillText("3", 40, 120);   // Mid Left Outer Triangle
        ctx.fillText("4", 60, 300);   // Left Diamond
        ctx.fillText("5", 40, 480);   // Mid Left Bottom Triangle
        ctx.fillText("6", 120, 560);  // Bottom Left Triangle
        ctx.fillText("7", 300, 540);  // Bottom Diamond
        ctx.fillText("8", 480, 560);  // Bottom Right Triangle
        ctx.fillText("9", 560, 480);  // Mid Right Bottom Triangle
        ctx.fillText("10", 540, 300); // Right Diamond
        ctx.fillText("11", 560, 120); // Mid Right Top Triangle
        ctx.fillText("12", 480, 40);  // Top Right Triangle

        // మీ ఒరిజినల్ గ్రహాల ఇమేజ్ లింక్స్ మరియు వాటి పర్ఫెక్ట్ సెంటర్ స్థానాలు (X, Y)
        const planets = [
            { url: 'https://i.ibb.co/cKFT5BQ8/surya-png.png', x: 300, y: 150 }, // 1వ ఇల్లు
            { url: 'https://i.ibb.co/svSx8jxW/chandra-png.png', x: 150, y: 75 },  // 2వ ఇల్లు
            { url: 'https://i.ibb.co/S4kmV6sc/mangala.png', x: 150, y: 300 },   // 4వ ఇల్లు
            { url: 'https://i.ibb.co/84dXYS0Q/budha-png.png', x: 75, y: 450 },    // 5వ ఇల్లు
            { url: 'https://i.ibb.co/TqPBxK7Z/guru-png.png', x: 300, y: 450 },   // 7వ ఇల్లు
            { url: 'https://i.ibb.co/NgxgvdXf/shukra-png.png', x: 450, y: 525 },  // 8వ ఇల్లు
            { url: 'https://i.ibb.co/v4vSwZJS/shani.png', x: 450, y: 300 },      // 10వ ఇల్లు
            { url: 'https://i.ibb.co/23XjGRqH/rahu-png.png', x: 525, y: 150 },    // 11వ ఇల్లు
            { url: 'https://i.ibb.co/GvzdFxD3/ketu-png.png', x: 450, y: 75 }      // 12వ ఇల్లు
        ];

        const iconSize = 70;

        // Drawing original planet images perfectly centered
        planets.forEach(p => {
            let img = new Image();
            img.crossOrigin = "Anonymous"; 
            img.src = p.url;
            img.onload = function() {
                ctx.drawImage(img, p.x - (iconSize / 2), p.y - (iconSize / 2), iconSize, iconSize); 
            }
        });
    </script>
</body>
</html>
