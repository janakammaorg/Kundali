<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ananda Guru - Space Kundali Chart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #chartContainer {
            width: 600px;
            height: 600px;
            position: relative;
            box-sizing: border-box;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border: 4px solid #f59e0b;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="chartContainer">
        <canvas id="kundaliCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : 'BURIDI VIKASH RAJU';
        const userDob = urlParams.get('dob') ? decodeURIComponent(urlParams.get('dob')) : '12-03-2003';
        const userTime = urlParams.get('time') ? decodeURIComponent(urlParams.get('time')) : '10:30 AM';

        const canvas = document.getElementById('kundaliCanvas');
        const ctx = canvas.getContext('2d');

        // North Indian Chart Diagonal Lines (White/Transparent style)
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, 600, 600);

        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(600, 600);
        ctx.moveTo(600, 0); ctx.lineTo(0, 600);
        
        ctx.moveTo(300, 0); ctx.lineTo(600, 300);
        ctx.moveTo(600, 300); ctx.lineTo(300, 600);
        ctx.moveTo(300, 600); ctx.lineTo(0, 300);
        ctx.moveTo(0, 300); ctx.lineTo(300, 0);
        ctx.stroke();

        // Center User Name and Details (Just like your reference image)
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(120, 230, 360, 120);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText(userName, 300, 270);

        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 14px Arial";
        ctx.fillText("DOB: " + userDob + "   TIME: " + userTime, 300, 315);

        // Drawing Planet Circles/Icons inside houses
        function drawPlanetIcon(x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            ctx.fillStyle = "#000000";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, x, y);
        }

        // Placing planet icons across houses matching your second image style
        drawPlanetIcon(300, 90, "#f97316", "As");   // Sun/Lagna
        drawPlanetIcon(150, 75, "#eab308", "Ju");   // Jupiter
        drawPlanetIcon(450, 75, "#a855f7", "Sa");   // Saturn
        drawPlanetIcon(530, 180, "#ef4444", "Ma");  // Mars
        drawPlanetIcon(75, 230, "#94a3b8", "Mo");   // Moon
        drawPlanetIcon(530, 420, "#38bdf8", "Ve");  // Venus
        drawPlanetIcon(75, 480, "#22c55e", "Sy");   // Sun
        drawPlanetIcon(300, 525, "#64748b", "Ke");  // Ketu
        drawPlanetIcon(450, 525, "#3b82f6", "Ra");  // Rahu
    </script>
</body>
</html>
